name: Build Beamer Android APK

on:
  push:
    branches: [ "main", "master", "android/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK variant to build (both, debug, or release)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.12"
  GRADLE_VERSION: "8.9"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  verify-wire-core:
    name: Verify Wire v6 Core & Mobile Vectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install core cryptographic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyNaCl>=1.6" "segno>=1.6"

      - name: Run shared core & Android bridge unit tests
        run: |
          python -m unittest \
            core.tests.test_android_bridge \
            core.tests.test_phone_contract \
            core.tests.test_phone_targets \
            core.tests.test_owner \
            core.tests.test_v6_vectors \
            core.tests.test_keytable \
            core.tests.test_settings_sync \
            core.tests.test_input_scale \
            -v

      - name: Verify golden Wire v6 phone/tablet test vectors
        run: |
          python tools/phone_vectors.py

  build-android-apk:
    name: Build Android & Tablet APK
    needs: verify-wire-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Beamer VERSION
        id: paths
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python ${{ env.PYTHON_VERSION }} (for Chaquopy build)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Accept Android SDK licenses and install Android 16 (API 36) SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" \
                        "platforms;android-36" \
                        "platforms;android-35" \
                        "build-tools;36.0.0" \
                        "build-tools;35.0.0"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Decode Release Keystore (if configured in repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "android/app/release-keystore.jks"
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace -PversionName="${{ steps.paths.outputs.version }}"

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace -PversionName="${{ steps.paths.outputs.version }}"

      - name: Stage APKs with versioned names
        run: |
          mkdir -p dist-apk
          VERSION="${{ steps.paths.outputs.version }}"
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "android/app/build/outputs/apk/debug/app-debug.apk" \
               "dist-apk/Beamer-${VERSION}-android-debug.apk"
          fi
          for apk in android/app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" "dist-apk/Beamer-${VERSION}-android-release.apk"
            fi
          done
          ls -lh dist-apk/

      - name: Upload Debug & Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Beamer-${{ steps.paths.outputs.version }}-Android-APKs
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30
