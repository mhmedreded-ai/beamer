name: Build Beamer Android APK

on:
  push:
    branches: [ "main", "master", "android/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK variant to build (both, debug, or release)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  GRADLE_VERSION: "8.9"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  verify-wire-core:
    name: Verify Wire v6 Core & Mobile Vectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install core cryptographic dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyNaCl>=1.6" "segno>=1.6"

      - name: Run shared core & Android bridge unit tests
        run: |
          python -m unittest \
            core.tests.test_android_bridge \
            core.tests.test_phone_contract \
            core.tests.test_phone_targets \
            core.tests.test_owner \
            core.tests.test_v6_vectors \
            core.tests.test_keytable \
            core.tests.test_settings_sync \
            core.tests.test_input_scale \
            -v

      - name: Verify golden Wire v6 phone/tablet test vectors
        run: |
          python tools/phone_vectors.py

  build-android-apk:
    name: Build Android & Tablet APK
    needs: verify-wire-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Beamer VERSION
        id: paths
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python ${{ env.PYTHON_VERSION }} (for Chaquopy build)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Accept Android SDK licenses and install Android 16 (API 36) SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" \
                        "platforms;android-36" \
                        "platforms;android-35" \
                        "build-tools;36.0.0" \
                        "build-tools;35.0.0"

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Decode Release Keystore (if configured in repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "android/app/release-keystore.jks"
          fi

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace -PversionName="${{ steps.paths.outputs.version }}"

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace -PversionName="${{ steps.paths.outputs.version }}"

      - name: Stage APKs with versioned names
        run: |
          mkdir -p dist-apk
          VERSION="${{ steps.paths.outputs.version }}"
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "android/app/build/outputs/apk/debug/app-debug.apk" \
               "dist-apk/Beamer-${VERSION}-android-debug.apk"
          fi
          for apk in android/app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" "dist-apk/Beamer-${VERSION}-android-release.apk"
            fi
          done
          ls -lh dist-apk/

      - name: Live Test APK on Honor MagicPad 2 (3000x1920 @ 290dpi) Emulator
        run: |
          sudo chmod 666 /dev/kvm || true
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          yes | "$SDKMANAGER" "emulator" "system-images;android-34;default;x86_64" > /dev/null || true
          echo "no" | "$AVDMANAGER" create avd -n magicpad2 -k "system-images;android-34;default;x86_64" --force
          CONFIG_INI=$(find "$HOME" -name "config.ini" 2>/dev/null | grep "magicpad2.avd" | head -n 1)
          if [ -n "$CONFIG_INI" ]; then
            cat >> "$CONFIG_INI" << 'EOF'
          hw.lcd.width=3000
          hw.lcd.height=1920
          hw.lcd.density=290
          hw.keyboard=yes
          hw.ramSize=4096
          EOF
          fi

          "${ANDROID_HOME}/emulator/emulator" -avd magicpad2 -skin 3000x1920 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim &
          EMULATOR_PID=$!

          "${ANDROID_HOME}/platform-tools/adb" wait-for-device
          for i in $(seq 1 90); do
            BOOT=$("${ANDROID_HOME}/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Honor MagicPad 2 emulator booted successfully."
              break
            fi
            sleep 2
          done

          ADB="${ANDROID_HOME}/platform-tools/adb"
          $ADB shell wm size 3000x1920
          $ADB shell wm density 290
          $ADB shell settings put global window_animation_scale 0
          $ADB shell settings put global transition_animation_scale 0
          $ADB shell settings put global animator_duration_scale 0

          VERSION="${{ steps.paths.outputs.version }}"
          $ADB install -r "dist-apk/Beamer-${VERSION}-android-release.apk"
          $ADB logcat -c

          echo "Launching uk.co.kalkman.beamer/.MainActivity on Honor MagicPad 2 (3000x1920)..."
          $ADB shell am start -W -n uk.co.kalkman.beamer/.MainActivity
          sleep 6

          APP_PID=$($ADB shell pidof uk.co.kalkman.beamer | tr -d '\r')
          echo "Running Process PID: $APP_PID"
          if [ -z "$APP_PID" ]; then
            echo "ERROR: App process died after launch!"
            $ADB logcat -d *:E
            exit 1
          fi

          $ADB exec-out screencap -p > "dist-apk/Honor-MagicPad-2-Permissions-Screen.png"
          $ADB shell uiautomator dump /sdcard/window_dump.xml
          $ADB pull /sdcard/window_dump.xml "dist-apk/magicpad2-ui-dump.xml"

          # Verify Python core bridge initialized cleanly ("Wire v6") and no startup errors occurred
          grep -q "Wire v6" "dist-apk/magicpad2-ui-dump.xml"
          grep -q "BEAMER" "dist-apk/magicpad2-ui-dump.xml"
          if grep -q "Python core init:" "dist-apk/magicpad2-ui-dump.xml"; then
            echo "ERROR: Python core init error found on screen!"
            cat "dist-apk/magicpad2-ui-dump.xml"
            exit 1
          fi

          # Tap Overview tab in NavigationRail & simulate trackpad drag on the right pane
          $ADB shell input tap 55 155
          sleep 2
          $ADB shell input swipe 2100 700 2550 920 250
          sleep 2
          $ADB exec-out screencap -p > "dist-apk/Honor-MagicPad-2-Overview-Screen.png"

          # Verify app is still alive after interactions and zero FATAL EXCEPTION occurred
          APP_PID_AFTER=$($ADB shell pidof uk.co.kalkman.beamer | tr -d '\r')
          if [ -z "$APP_PID_AFTER" ]; then
            echo "ERROR: App crashed during UI interaction!"
            $ADB logcat -d *:E
            exit 1
          fi
          if $ADB logcat -d | grep -q "FATAL EXCEPTION"; then
            echo "ERROR: FATAL EXCEPTION detected in logcat!"
            $ADB logcat -d *:E
            exit 1
          fi

          {
            echo "Honor MagicPad 2 (3000x1920 @ 290dpi) Live Verification Report"
            echo "=============================================================="
            echo "APK Tested: Beamer-${VERSION}-android-release.apk"
            echo "Display Size: $($ADB shell wm size | tr -d '\r')"
            echo "Display Density: $($ADB shell wm density | tr -d '\r')"
            echo "Process PID Before Interaction: $APP_PID"
            echo "Process PID After Interaction:  $APP_PID_AFTER"
            echo "UI Verification: BEAMER dual-pane + Wire v6 Python Core Bridge active"
            echo "Fatal Exceptions: 0"
          } > "dist-apk/magicpad2-test-report.txt"
          cat "dist-apk/magicpad2-test-report.txt"

          kill $EMULATOR_PID || true

      - name: Upload Debug & Release APK Artifacts + Honor MagicPad 2 Test Proof
        uses: actions/upload-artifact@v4
        with:
          name: Beamer-${{ steps.paths.outputs.version }}-Android-APKs
          path: |
            dist-apk/*.apk
            dist-apk/*.png
            dist-apk/*.txt
            dist-apk/*.xml
          if-no-files-found: error
          retention-days: 30
